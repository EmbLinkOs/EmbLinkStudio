# Lint and format settings for all Python in the repository (CI runs ruff).
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "EXE"]

[lint.isort]
known-first-party = ["emblink_studio_core", "conftest"]
