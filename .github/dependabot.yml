# Dependabot: keeps the GitHub Actions used by CI up to date, one grouped pull request a week.
# The core has no runtime dependencies yet; add a pip entry for /core when it gains one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
