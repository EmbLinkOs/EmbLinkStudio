# Packaging of EmbLink Studio Core (the Python engine) and its test settings.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emblink-studio-core"
dynamic = ["version"]
description = "EmbLink Studio Core: the engine behind the EmbLink Studio IDE for EmbLinkRTOS"
license = "Apache-2.0"
requires-python = ">=3.11"
# Runtime dependencies must also be listed in third_party/components.json (tools/notices.py checks).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21", "ruff>=0.6"]

[project.scripts]
emblink-studio-core = "emblink_studio_core.cli:main"

[tool.setuptools.dynamic]
version = { attr = "emblink_studio_core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
